<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pacific Times Book Market Customer Sign In</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f5f5, #ffffff);
            color: #111111;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .signin-card {
            width: 100%;
            max-width: 440px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.10);
            padding: 32px;
            border: 1px solid #dddddd;
        }

        .signin-card h1 {
            font-size: 30px;
            margin-bottom: 12px;
            color: #111111;
        }

        .signin-card p {
            color: #555555;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .signin-form {
            display: grid;
            gap: 14px;
        }

        .signin-form label {
            font-weight: bold;
            color: #222222;
            font-size: 14px;
        }

        .signin-form input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cccccc;
            border-radius: 10px;
            font-size: 15px;
        }

        .customer-btn {
            background: #111111;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-link {
            display: inline-block;
            margin-top: 16px;
            color: #111111;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="signin-card">
        <h1>Customer Sign In</h1>
        <p>Sign in to view your customer dashboard and account details.</p>
        <form class="signin-form" method="POST" action="/customer-signin">

    {% if error_message %}
        <p style="color:red; margin-bottom:10px;">{{ error_message }}</p>
    {% endif %}

    <div>
        <label for="customer_name">Customer Name</label>
        <input id="customer_name" name="customer_name" type="text" placeholder="Enter your name" />
    </div>
    <div>
        <label for="customer_email">Customer Email</label>
        <input id="customer_email" name="customer_email" type="email" placeholder="Enter your email" />
    </div>
    <button class="customer-btn" type="submit">Sign In</button>
</form>
        <a class="back-link" href="/">← Back to customer store</a>
    </div>
</body>
</html>
