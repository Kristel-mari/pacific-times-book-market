<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pacific Times Book Market Customer Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f7f7;
            color: #111111;
            padding: 32px;
        }

        .dashboard-header {
            background: #111111;
            color: white;
            border-radius: 18px;
            padding: 24px 28px;
            margin-bottom: 24px;
        }

        .dashboard-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .dashboard-header p {
            color: #dddddd;
        }

        .dashboard-actions {
            margin-top: 16px;
        }

        .dashboard-actions a {
            display: inline-block;
            background: white;
            color: #111111;
            padding: 10px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        .dashboard-card {
            background: white;
            border: 1px solid #dddddd;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            max-width: 700px;
        }

        .dashboard-card h2 {
            margin-bottom: 18px;
        }

        .dashboard-row {
            margin-bottom: 14px;
            font-size: 16px;
        }

        .dashboard-row strong {
            color: #111111;
        }
    </style>
</head>
<body>
    <div class="dashboard-header">
        <h1>Customer Dashboard</h1>
        <p>Welcome {{ customer_name if customer_name else 'Customer' }}.</p>
        <div class="dashboard-actions">
            <a href="/">Return to storefront</a>
        </div>
    </div>

    <div class="dashboard-card">
        <h2>Account Details</h2>
        <div class="dashboard-row"><strong>Name:</strong> {{ customer_name if customer_name else 'Not provided' }}</div>
        <div class="dashboard-row"><strong>Email:</strong> {{ customer_email if customer_email else 'Not provided' }}</div>
        <div class="dashboard-row"><strong>Status:</strong> Signed in</div>
    </div>
</body>
</html>
