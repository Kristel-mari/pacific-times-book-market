<!DOCTYPE html>
<html>
<head>
    <title>Add Sale</title>
</head>
<body>

<h1>Add Manual Sale</h1>

<a href="{{ url_for('employee_dashboard') }}">← Back to Dashboard</a>

{% if error_message %}
    <p style="color:red;">{{ error_message }}</p>
{% endif %}

<form method="POST">

    <label>Customer Name:</label><br>
    <input type="text" name="customer_name"><br><br>

    <label>Select Book:</label><br>
    <select name="book_id">
        {% for book in books %}
            <option value="{{ book.id }}">
                {{ book.title }} ({{ book.inventory }} in stock)
            </option>
        {% endfor %}
    </select><br><br>

    <label>Quantity:</label><br>
    <input type="number" name="quantity" min="1" value="1"><br><br>

    <button type="submit">Submit Sale</button>

</form>

</body>
</html>
